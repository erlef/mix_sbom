name: "Mix SBoM"
description: "Calculates dependencies for Mix and outputs a CycloneDX File"
author: "Erlang Ecosystem Foundation"
branding:
  icon: arrow-up
  color: blue
inputs:
  project-path:
    required: true
    description: "Repo path to the mix.exs file used to detect dependencies. Defaults to mix.exs in the root of the repository."
    default: "${{ github.workspace }}"
  schema:
    required: true
    description: "CycloneDX Schema Version"
    default: "1.6"
  format:
    required: true
    description: "CycloneDX Output Format"
    default: "json"
  reuse-beam:
    required: false
    description: "Use local BEAM installation instead of pre-compiled binaries. Requires Elixir/Erlang to be set up beforehand."
    default: "false"
  include-system-dependencies:
    required: false
    description: "Include system dependencies (Erlang/OTP, Elixir, Hex) in the SBoM."
    default: "true"
  only:
    required: false
    description: "Only include components used in the specified environments. Space-separated, e.g. 'dev test prod'. Defaults to all environments."
    default: ""
  targets:
    required: false
    description: "Only include components used for the specified Mix targets. Space-separated. Defaults to all targets."
    default: ""
  classification:
    required: false
    description: "Type of application being described. One of: application, framework, library, operating-system, device, file, container, firmware, device-driver, platform, machine-learning-model, data, cryptographic-asset."
    default: ""
  hex-api-key:
    required: false
    description: "Hex.pm API key used to authenticate metadata requests, avoiding rate limits."
    default: ""
  recurse:
    required: false
    description: "Recurse into umbrella applications to generate SBoM for all apps."
    default: "false"
  pretty:
    required: false
    description: "Pretty print the SBoM."
    default: "false"
outputs:
  sbom-path:
    description: "Path to the generated SBoM"
    value: "${{ steps.generate.outputs.output }}"
runs:
  using: "composite"
  steps:
    - name: "Install SBoM Tool"
      run: |
        set -e

        if [ "$REUSE_BEAM" = "true" ]; then
          mix escript.install \
            github "$REPO" \
            tag "$TAG" \
            --force

          echo "$HOME/.mix/escripts" >> "$GITHUB_PATH"
        else
          BIN_PATH="$(pwd)/mix_sbom_bin"

          mkdir "$BIN_PATH"

          gh release download \
            "$TAG" \
            --repo "$REPO" \
            --pattern "mix_sbom_${{ runner.os }}_${{ runner.arch }}" \
            --output "$BIN_PATH/mix_sbom"

          gh attestation verify \
            --repo "$REPO" \
            --source-ref "refs/tags/$TAG" \
            "$BIN_PATH/mix_sbom"

          chmod +x "$BIN_PATH/mix_sbom"

          echo "$BIN_PATH" >> "$GITHUB_PATH"
        fi
      shell: "bash"
      working-directory: "${{ runner.temp }}"
      env:
        TAG: "v0.10.0"
        GITHUB_TOKEN: ${{ github.token }}
        REPO: "erlef/mix_sbom"
        REUSE_BEAM: "${{ inputs.reuse-beam }}"
    - name: "Generate SBoM"
      id: generate
      run: |
        set -e

        OUTPUT_TEMP="$RUNNER_TEMP/$RANDOM.cdx.$FORMAT"

        ARGS=(
          cyclonedx
          --schema="$SCHEMA"
          --format="$FORMAT"
          --output="$OUTPUT_TEMP"
        )

        if [ "$EXCLUDE_SYSTEM_DEPENDENCIES" = "true" ]; then
          ARGS+=(--exclude-system-dependencies)
        fi

        for value in $ONLY; do
          ARGS+=(--only "$value")
        done

        for value in $TARGETS; do
          ARGS+=(--targets "$value")
        done

        if [ -n "$CLASSIFICATION" ]; then
          ARGS+=(--classification "$CLASSIFICATION")
        fi

        if [ -n "$HEX_API_KEY" ]; then
          ARGS+=(--hex-api-key "$HEX_API_KEY")
        fi

        if [ "$RECURSE" = "true" ]; then
          ARGS+=(--recurse)
        fi

        if [ "$PRETTY" = "true" ]; then
          ARGS+=(--pretty)
        fi

        ARGS+=("$PROJECT_PATH")

        mix_sbom "${ARGS[@]}"

        echo "output=$OUTPUT_TEMP" >> "$GITHUB_OUTPUT"
      shell: "bash"
      env:
        PROJECT_PATH: "${{ inputs.project-path }}"
        SCHEMA: "${{ inputs.schema }}"
        FORMAT: "${{ inputs.format }}"
        EXCLUDE_SYSTEM_DEPENDENCIES: "${{ inputs.include-system-dependencies == 'true' && 'false' || 'true' }}"
        ONLY: "${{ inputs.only }}"
        TARGETS: "${{ inputs.targets }}"
        CLASSIFICATION: "${{ inputs.classification }}"
        HEX_API_KEY: "${{ inputs.hex-api-key }}"
        RECURSE: "${{ inputs.recurse }}"
        PRETTY: "${{ inputs.pretty }}"
