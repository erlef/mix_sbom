on:
  workflow_call:
    inputs:
      attest:
        description: "Attest the build"
        default: true
        type: boolean

name: "Build"

permissions:
  contents: read

jobs:
  detectToolVersions:
    name: "Detect Tool Versions"

    runs-on: ubuntu-latest

    outputs:
      zigVersion: "${{ steps.toolVersions.outputs.ZIG_VERSION }}"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Read .tool-versions"
        id: toolVersions
        run: |
          ZIG_VERSION="$(cat .tool-versions | grep zig | cut -d' ' -f2-)"
          echo Zig: $ZIG_VERSION
          echo "ZIG_VERSION=${ZIG_VERSION}" >> $GITHUB_OUTPUT

  escript:
    name: "EScript"

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runtime-env
        with:
          mix-env: prod

      - name: "Build EScript"
        run: mix escript.build
      
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: escript
          path: "mix_sbom"

  binary:
    name: "Binary (${{ matrix.target }})"

    runs-on: ubuntu-latest

    needs: ['detectToolVersions']

    strategy:
      fail-fast: false
      matrix:
        target:
          - Linux_X64
          - Linux_ARM64
          - macOS_X64
          - macOS_ARM64
          - Windows_X64

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "${{ needs.detectToolVersions.outputs.zigVersion }}"

      - run: sudo apt-get install -y xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-runtime-env
        with:
          mix-env: prod
          enable-burrito: "true"

      - run: mix release --overwrite
        env:
          BURRITO_TARGET: "${{ matrix.target }}"
      - name: "Attest provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest-provenance
        if: "${{ inputs.attest }}"
        with:
          subject-path: 'burrito_out/mix_sbom*'
      - name: "Copy provenance"
        if: "${{ inputs.attest }}"
        run: |-
          for FILE in burrito_out/mix_sbom*; do
            cp "$ATTESTATION" $FILE.sigstore
          done
        env:
          ATTESTATION: "${{ steps.attest-provenance.outputs.bundle-path }}"
      
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: burrito_out/*
